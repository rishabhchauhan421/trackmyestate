<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>App sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&amp;family=Geist:wght@400;500;600&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}
a:hover{color:#FFFFFF}
</style>
</helmet>
<aside style="width: 264px; min-height: 100%; height: 100%; box-sizing: border-box; background: #10201C; color: #C3CFCA; font-family: 'Geist', system-ui, sans-serif; display: flex; flex-direction: column; padding: 20px 16px; gap: 24px">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 4px 8px">
    <span style="width: 32px; height: 32px; border-radius: 9px; background: #5FD0B4; color: #0B1714; display: flex; align-items: center; justify-content: center; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 17px">T</span>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 600; font-size: 17px; color: #FFFFFF; letter-spacing: -0.01em">TrackMyEstate</span>
  </a>

  <a href="AddProperty.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 44px; border-radius: 10px; background: #5FD0B4; color: #0B1714; font-weight: 600; font-size: 14px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    Add asset
  </a>

  <nav aria-label="Main" style="display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="padding: 0 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7F918A">Overview</span>
      <a href="Main.dc.html" aria-current="{{dashboard.aria}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 500; background: {{dashboard.bg}}; color: {{dashboard.fg}}; box-shadow: {{dashboard.ring}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{dashboard.icon}}"><rect x="3" y="3" width="8" height="8" rx="1.5"></rect><rect x="13" y="3" width="8" height="5" rx="1.5"></rect><rect x="13" y="10" width="8" height="11" rx="1.5"></rect><rect x="3" y="13" width="8" height="8" rx="1.5"></rect></svg>
        Dashboard
      </a>
      <a href="Main.dc.html" aria-current="{{timeline.aria}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 500; background: {{timeline.bg}}; color: {{timeline.fg}}; box-shadow: {{timeline.ring}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{timeline.icon}}"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
        Timeline
        <span style="margin-left: auto; min-width: 22px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: #F2B544; color: #2A1A00; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center">3</span>
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="padding: 0 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7F918A">Assets</span>
      <a href="Properties.dc.html" aria-current="{{properties.aria}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 500; background: {{properties.bg}}; color: {{properties.fg}}; box-shadow: {{properties.ring}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{properties.icon}}"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path><path d="M10 20v-6h4v6"></path></svg>
        Properties
      </a>
      <a href="Main.dc.html" aria-current="{{insurance.aria}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 500; background: {{insurance.bg}}; color: {{insurance.fg}}; box-shadow: {{insurance.ring}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{insurance.icon}}"><path d="M12 3l8 3v6c0 4.5-3.4 8.3-8 9-4.6-.7-8-4.5-8-9V6l8-3z"></path><path d="M9 12l2 2 4-4"></path></svg>
        Insurance
      </a>
      <a href="Main.dc.html" aria-current="{{investments.aria}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 500; background: {{investments.bg}}; color: {{investments.fg}}; box-shadow: {{investments.ring}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{investments.icon}}"><path d="M3 17l6-6 4 4 8-8"></path><path d="M15 7h6v6"></path></svg>
        Investments
      </a>
      <a href="Main.dc.html" aria-current="{{loans.aria}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 500; background: {{loans.bg}}; color: {{loans.fg}}; box-shadow: {{loans.ring}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{loans.icon}}"><path d="M3 9l9-5 9 5"></path><path d="M5 9v9M10 9v9M14 9v9M19 9v9"></path><path d="M3 20h18"></path></svg>
        Loans
      </a>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="padding: 0 12px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7F918A">Vault</span>
      <a href="Main.dc.html" aria-current="{{documents.aria}}" style="display: flex; align-items: center; gap: 12px; height: 40px; padding: 0 12px; border-radius: 9px; font-size: 14px; font-weight: 500; background: {{documents.bg}}; color: {{documents.fg}}; box-shadow: {{documents.ring}}">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: {{documents.icon}}"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path></svg>
        Documents
      </a>
    </div>
  </nav>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px">
    <div style="border-radius: 12px; background: #182C27; padding: 14px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 600; color: #FFFFFF">Reminders are on</span>
      <span style="font-size: 12px; line-height: 1.45; color: #A9B8B2">Email nudges 5–14 days before each due date.</span>
    </div>
    <a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 10px">
      <span style="width: 34px; height: 34px; border-radius: 999px; background: #2B4A42; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600">AR</span>
      <span style="display: flex; flex-direction: column; min-width: 0">
        <span style="font-size: 13px; font-weight: 600; color: #FFFFFF">Ananya Rao</span>
        <span style="font-size: 12px; color: #93A49D">Settings &amp; sign out</span>
      </span>
    </a>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["dashboard","timeline","properties","insurance","investments","loans","documents"],"default":"dashboard"},"$preview":{"width":264,"height":1180}}'>
class Component extends DCLogic {
  renderVals() {
    var current = this.props.current ?? 'dashboard';
    var keys = ['dashboard', 'timeline', 'properties', 'insurance', 'investments', 'loans', 'documents'];
    var vals = {};
    keys.forEach(function (k) {
      var on = k === current;
      vals[k] = {
        aria: on ? 'page' : undefined,
        bg: on ? '#21413A' : 'transparent',
        fg: on ? '#FFFFFF' : '#C3CFCA',
        icon: on ? '#5FD0B4' : '#8EA19A',
        ring: on ? 'inset 3px 0 0 #5FD0B4' : 'none'
      };
    });
    return vals;
  }
}
</script>
</body>
</html>
