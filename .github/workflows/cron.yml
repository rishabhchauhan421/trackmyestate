# Manual runs of the background jobs. Their schedules live in vercel.json
# (Vercel Cron, on the Pro plan):
#
#   every 15 minutes → /api/cron/notifications   (send due reminders)
#   hourly at :05    → /api/cron/reminders       (queue today's reminders)
#   daily at 03:00   → /api/cron/bills           (generate bills)
#
# Run one from the Actions tab to catch up by hand. Needs two repository
# secrets (Settings → Secrets and variables → Actions):
#   APP_URL      the deployed app, e.g. https://trackmyestate.app
#   CRON_SECRET  the same value as the app's CRON_SECRET env var

name: Background jobs

on:
  workflow_dispatch:
    inputs:
      job:
        description: Which job to run
        type: choice
        options: [notifications, reminders, bills]
        default: notifications

permissions: {}

concurrency:
  group: background-jobs-${{ inputs.job }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secrets are set
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Set the APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi

      - name: Queue reminders
        if: inputs.job == 'reminders'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/reminders"

      - name: Generate bills
        if: inputs.job == 'bills'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/bills"

      - name: Send due reminders
        if: inputs.job == 'notifications'
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/notifications"
